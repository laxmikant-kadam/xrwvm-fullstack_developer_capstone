apiVersion: apps/v1
kind: Deployment
metadata:
  name: cars-dealership
  labels:
    app: cars-dealership
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cars-dealership
  template:
    metadata:
      labels:
        app: cars-dealership
        tier: frontend
    spec:
      containers:
        - name: django
          image: us.icr.io/cars-dealership-ns/cars-dealership:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_DEBUG
              value: "False"
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cars-dealership-secret
                  key: django-secret-key
            - name: SENTIMENT_ANALYZER_URL
              value: "http://sentiment-service:5050/analyze"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /djangoapp/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /djangoapp/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cars-dealership-sentiment
  labels:
    app: cars-dealership-sentiment
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cars-dealership-sentiment
  template:
    metadata:
      labels:
        app: cars-dealership-sentiment
        tier: backend
    spec:
      containers:
        - name: sentiment
          image: us.icr.io/cars-dealership-ns/cars-dealership-sentiment:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 5050
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5050
            initialDelaySeconds: 5
            periodSeconds: 10
