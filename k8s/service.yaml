apiVersion: v1
kind: Service
metadata:
  name: cars-dealership-service
  labels:
    app: cars-dealership
spec:
  type: NodePort
  selector:
    app: cars-dealership
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 32000
---
apiVersion: v1
kind: Service
metadata:
  name: sentiment-service
  labels:
    app: cars-dealership-sentiment
spec:
  type: ClusterIP
  selector:
    app: cars-dealership-sentiment
  ports:
    - name: http
      port: 5050
      targetPort: 5050
