apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cars-dealership-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: cars-dealership.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cars-dealership-service
                port:
                  number: 8000
