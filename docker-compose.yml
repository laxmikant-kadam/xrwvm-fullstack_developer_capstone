version: "3.9"

services:
  django:
    build: .
    container_name: cars-dealership-django
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "False"
      SENTIMENT_ANALYZER_URL: "http://sentiment:5050/analyze"
    depends_on:
      - sentiment
    volumes:
      - sqlite-data:/app/data

  sentiment:
    build: ./sentiment_analyzer
    container_name: cars-dealership-sentiment
    ports:
      - "5050:5050"

volumes:
  sqlite-data:
