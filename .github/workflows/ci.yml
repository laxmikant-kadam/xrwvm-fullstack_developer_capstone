name: Cars Dealership CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "20"

jobs:
  backend-tests:
    name: Django API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Apply database migrations
        run: python manage.py migrate

      - name: Load dealership seed data
        run: python manage.py seed_db

      - name: Run Django test suite
        run: python manage.py test --verbosity 2

  sentiment-service-tests:
    name: Sentiment analyser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install sentiment service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sentiment_analyzer/requirements.txt

      - name: Run analyser unit tests
        run: python -m unittest discover -s sentiment_analyzer/tests -v

      - name: Smoke test the Flask endpoint
        run: |
          python sentiment_analyzer/app.py &
          sleep 3
          curl -s -X POST -H "Content-Type: application/json" \
            -d '{"text": "Fantastic services"}' http://localhost:5050/analyze

  frontend-build:
    name: React production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build the React application
        run: npm run build
        env:
          CI: "false"

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: server/frontend/build
          retention-days: 7

  docker-image:
    name: Build deployment images
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Django image
        run: docker build -t cars-dealership:${{ github.sha }} .

      - name: Build sentiment analyser image
        run: docker build -t cars-dealership-sentiment:${{ github.sha }} ./sentiment_analyzer

      - name: Verify images
        run: docker images
